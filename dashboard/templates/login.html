<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GymLocker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; background: #0d0d0d; display: flex; align-items: center; justify-content: center; font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif; color: #e0e0e0; }
  .card { background: #161616; border: 1px solid #1e1e1e; border-radius: 16px; padding: 48px 40px; width: 100%; max-width: 380px; }
  .logo { margin-bottom: 36px; }
  .logo h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.8px; color: #e0e0e0; }
  .logo p { font-size: 13px; color: #555; margin-top: 4px; font-weight: 400; }
  .error { background: #2d0e0e; border: 1px solid #7f1d1d; color: #fca5a5; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 18px; }
  .form-group { margin-bottom: 14px; }
  label { display: block; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: #555; margin-bottom: 6px; }
  input[type="text"], input[type="password"] { width: 100%; padding: 11px 14px; background: #111; border: 1px solid #1e1e1e; border-radius: 8px; color: #e0e0e0; font-size: 15px; font-family: inherit; outline: none; transition: border-color 0.15s; }
  input:focus { border-color: #4ade80; background: #0d0d0d; }
  .btn { width: 100%; padding: 12px; background: #4ade80; color: #0d0d0d; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px; font-family: inherit; transition: opacity 0.15s; letter-spacing: -0.2px; }
  .btn:hover { opacity: 0.85; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <h1>GymLocker</h1>
    <p>Sign in to your locker</p>
  </div>
  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}
  <form method="post" action="/login">
    <div class="form-group">
      <label>Username</label>
      <input type="text" name="username" autocomplete="username" autofocus required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn">Sign In</button>
  </form>
</div>
</body>
</html>
