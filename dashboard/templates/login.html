<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workout Tracker — Login</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: #0d0d0d;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #e0e0e0;
  }
  .card {
    background: #161616;
    border: 1px solid #252525;
    border-radius: 14px;
    padding: 44px 40px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .logo { text-align: center; margin-bottom: 32px; }
  .logo .icon { font-size: 36px; margin-bottom: 10px; }
  .logo h1 { font-size: 22px; font-weight: 700; color: #fff; letter-spacing: -0.3px; }
  .logo p { color: #666; font-size: 14px; margin-top: 5px; }
  .error {
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.3);
    color: #f87171;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 18px;
    text-align: center;
  }
  .form-group { margin-bottom: 16px; }
  label { display: block; font-size: 12px; font-weight: 500; color: #888; margin-bottom: 7px; letter-spacing: 0.4px; text-transform: uppercase; }
  input[type="text"], input[type="password"] {
    width: 100%;
    padding: 11px 14px;
    background: #0d0d0d;
    border: 1px solid #2a2a2a;
    border-radius: 8px;
    color: #fff;
    font-size: 15px;
    outline: none;
    transition: border-color 0.15s;
  }
  input:focus { border-color: #4ade80; }
  .btn {
    width: 100%;
    padding: 12px;
    background: #4ade80;
    color: #000;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
    transition: background 0.15s, transform 0.1s;
    letter-spacing: 0.1px;
  }
  .btn:hover { background: #22c55e; }
  .btn:active { transform: scale(0.98); }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="icon">💪</div>
    <h1>Workout Tracker</h1>
    <p>Sign in to view your progress</p>
  </div>
  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}
  <form method="post" action="/login">
    <div class="form-group">
      <label>Username</label>
      <input type="text" name="username" autocomplete="username" autofocus required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn">Sign In</button>
  </form>
</div>
</body>
</html>
