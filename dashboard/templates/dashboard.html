<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GymLocker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e8e4d8;
    --surface: #f0ece0;
    --white: #faf8f3;
    --border: #ccc8bc;
    --border-strong: #9a9488;
    --ink: #1a1a1a;
    --ink-2: #666;
    --ink-3: #aaa;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif; min-height: 100vh; }

  nav { background: var(--bg); border-bottom: 1px solid var(--border); padding: 0 24px; height: 58px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 200; }
  .nav-brand { font-size: 17px; font-weight: 700; color: var(--ink); letter-spacing: -0.3px; }
  .nav-right { display: flex; align-items: center; gap: 8px; }
  .nav-right a { font-size: 13px; font-weight: 500; color: var(--ink-2); text-decoration: none; padding: 6px 14px; border: 1px solid var(--border); border-radius: 20px; transition: all 0.15s; background: var(--white); }
  .nav-right a:hover { border-color: var(--ink); color: var(--ink); }
  .nav-right a.new { background: var(--ink); color: var(--white); border-color: var(--ink); }
  .nav-right a.new:hover { background: #333; }

  main { padding: 24px; max-width: 1440px; margin: 0 auto; }

  /* Calendar header */
  .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .cal-title { font-size: 22px; font-weight: 700; color: var(--ink); letter-spacing: -0.5px; }
  .cal-nav { display: flex; gap: 6px; }
  .cal-nav button { background: var(--white); border: 1px solid var(--border); color: var(--ink-2); border-radius: 20px; padding: 6px 16px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s; font-family: inherit; }
  .cal-nav button:hover { border-color: var(--ink); color: var(--ink); }

  /* Day-of-week headers */
  .cal-dow { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 4px; }
  .cal-dow-cell { text-align: center; font-size: 10px; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.8px; padding: 6px 0; }

  /* Calendar grid */
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-cell {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 10px;
    min-height: 100px;
    padding: 10px;
    position: relative;
    cursor: default;
    transition: all 0.12s;
    overflow: hidden;
  }
  .cal-cell.empty { background: transparent; border-color: transparent; }
  .cal-cell.has-workout { background: var(--ink); border-color: var(--ink); cursor: pointer; }
  .cal-cell.has-workout:hover { background: #2a2a2a; }
  .cal-cell.is-today { border-color: var(--ink) !important; border-width: 2px; }
  .cal-cell.is-today:not(.has-workout) .cal-day-num { color: var(--ink); font-weight: 700; }

  .cal-day-num { font-size: 12px; font-weight: 600; color: var(--ink-3); margin-bottom: 6px; }
  .cal-cell.has-workout .cal-day-num { color: rgba(255,255,255,0.5); }

  .cal-dot { width: 5px; height: 5px; background: rgba(255,255,255,0.6); border-radius: 50%; margin-bottom: 6px; }

  .cal-ex-list { display: flex; flex-direction: column; gap: 2px; }
  .cal-ex-name { font-size: 11px; color: rgba(255,255,255,0.85); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.4; font-weight: 500; }
  .cal-ex-more { font-size: 10px; color: rgba(255,255,255,0.4); margin-top: 2px; }

  /* Tooltip */
  #tooltip {
    position: fixed; z-index: 999;
    background: var(--ink); color: var(--white);
    border-radius: 12px; padding: 14px 16px;
    min-width: 200px; max-width: 280px;
    pointer-events: none; display: none;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  }
  .tt-date { font-size: 13px; font-weight: 700; margin-bottom: 2px; }
  .tt-meta { font-size: 11px; color: rgba(255,255,255,0.5); margin-bottom: 10px; font-weight: 500; letter-spacing: 0.3px; }
  .tt-divider { height: 1px; background: rgba(255,255,255,0.12); margin-bottom: 10px; }
  .tt-ex { margin-bottom: 7px; }
  .tt-ex:last-child { margin-bottom: 0; }
  .tt-ex-name { font-size: 12px; font-weight: 600; margin-bottom: 1px; }
  .tt-ex-sets { font-size: 11px; color: rgba(255,255,255,0.45); font-family: 'SF Mono', Menlo, monospace; }
</style>
</head>
<body>

<nav>
  <div class="nav-brand">GymLocker</div>
  <div class="nav-right">
    <a href="/workout/new" class="new">+ New Workout</a>
    <a href="/summary">Summary</a>
    <a href="/logout">Sign out</a>
  </div>
</nav>

<main>
  <div class="cal-header">
    <div class="cal-title" id="cal-title"></div>
    <div class="cal-nav">
      <button onclick="shiftMonth(-1)">←</button>
      <button onclick="goToday()">Today</button>
      <button onclick="shiftMonth(1)">→</button>
    </div>
  </div>
  <div class="cal-dow">
    <div class="cal-dow-cell">Mon</div>
    <div class="cal-dow-cell">Tue</div>
    <div class="cal-dow-cell">Wed</div>
    <div class="cal-dow-cell">Thu</div>
    <div class="cal-dow-cell">Fri</div>
    <div class="cal-dow-cell">Sat</div>
    <div class="cal-dow-cell">Sun</div>
  </div>
  <div class="cal-grid" id="cal-grid"></div>
</main>

<div id="tooltip"></div>

<script>
const workouts = {{ workouts_json | safe }};
const byDate = {};
workouts.forEach(w => {
  if (!byDate[w.date]) byDate[w.date] = [];
  byDate[w.date].push(w);
});

const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const today = new Date();
let curYear = today.getFullYear(), curMonth = today.getMonth();

function pad(n) { return String(n).padStart(2, '0'); }
function dateStr(y, m, d) { return `${y}-${pad(m+1)}-${pad(d)}`; }

function renderCalendar() {
  const firstDay = new Date(curYear, curMonth, 1);
  const daysInMonth = new Date(curYear, curMonth + 1, 0).getDate();
  const todayStr = dateStr(today.getFullYear(), today.getMonth(), today.getDate());
  document.getElementById('cal-title').textContent = `${MONTHS[curMonth]} ${curYear}`;
  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';
  const offset = (firstDay.getDay() + 6) % 7;
  for (let i = 0; i < offset; i++) {
    const el = document.createElement('div');
    el.className = 'cal-cell empty';
    grid.appendChild(el);
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const ds = dateStr(curYear, curMonth, d);
    const sessions = byDate[ds] || [];
    const hasWorkout = sessions.length > 0;
    const isToday = ds === todayStr;
    const cell = document.createElement('div');
    cell.className = 'cal-cell' + (hasWorkout ? ' has-workout' : '') + (isToday ? ' is-today' : '');
    let inner = `<div class="cal-day-num">${d}</div>`;
    if (hasWorkout) {
      const allExNames = sessions.flatMap(s => s.exercise_names);
      inner += `<div class="cal-dot"></div><div class="cal-ex-list">`;
      allExNames.slice(0, 3).forEach(name => { inner += `<div class="cal-ex-name">${escHtml(name)}</div>`; });
      if (allExNames.length > 3) inner += `<div class="cal-ex-more">+${allExNames.length - 3} more</div>`;
      inner += `</div>`;
      cell.addEventListener('mouseenter', e => showTooltip(e, ds, sessions));
      cell.addEventListener('mouseleave', hideTooltip);
      cell.addEventListener('click', () => { window.location.href = `/log/${ds}`; });
    }
    cell.innerHTML = inner;
    grid.appendChild(cell);
  }
}

function shiftMonth(dir) {
  curMonth += dir;
  if (curMonth > 11) { curMonth = 0; curYear++; }
  if (curMonth < 0)  { curMonth = 11; curYear--; }
  renderCalendar();
}
function goToday() { curYear = today.getFullYear(); curMonth = today.getMonth(); renderCalendar(); }

const tooltip = document.getElementById('tooltip');
function showTooltip(e, ds, sessions) {
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const [y, m, d] = ds.split('-').map(Number);
  const totalEx = sessions.reduce((s, w) => s + w.exercises.length, 0);
  const durs = sessions.map(w => w.duration).filter(Boolean);
  let html = `<div class="tt-date">${months[m-1]} ${d}, ${y}</div>`;
  html += `<div class="tt-meta">${totalEx} exercise${totalEx !== 1 ? 's' : ''}${durs.length ? ' · ' + durs.join('+') + ' min' : ''}</div>`;
  html += `<div class="tt-divider"></div>`;
  sessions.forEach(w => w.exercises.forEach(ex => {
    html += `<div class="tt-ex"><div class="tt-ex-name">${escHtml(ex.name)}</div>${ex.sets_raw ? `<div class="tt-ex-sets">${escHtml(ex.sets_raw)}</div>` : ''}</div>`;
  }));
  tooltip.innerHTML = html;
  tooltip.style.display = 'block';
  positionTooltip(e);
}
function positionTooltip(e) {
  const tw = tooltip.offsetWidth, th = tooltip.offsetHeight;
  let x = e.clientX + 16, y = e.clientY + 16;
  if (x + tw > window.innerWidth - 8) x = e.clientX - tw - 8;
  if (y + th > window.innerHeight - 8) y = e.clientY - th - 8;
  tooltip.style.left = x + 'px'; tooltip.style.top = y + 'px';
}
function hideTooltip() { tooltip.style.display = 'none'; }
document.getElementById('cal-grid').addEventListener('mousemove', e => { if (tooltip.style.display === 'block') positionTooltip(e); });
function escHtml(str) { return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

renderCalendar();
</script>
</body>
</html>
