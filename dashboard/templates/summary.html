<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GymLocker — Summary</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d0d0d; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; min-height: 100vh; padding-bottom: 48px; }

  nav { background: #111; border-bottom: 1px solid #1e1e1e; padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .nav-brand { font-size: 16px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 8px; }
  .nav-brand span { color: #4ade80; }
  .nav-right { display: flex; gap: 12px; align-items: center; }
  .nav-right a { font-size: 13px; color: #888; text-decoration: none; padding: 6px 12px; border: 1px solid #2a2a2a; border-radius: 6px; transition: all 0.15s; }
  .nav-right a:hover { color: #fff; border-color: #444; }
  .nav-right a.new { color: #4ade80; border-color: #4ade80; }

  main { padding: 28px 24px; max-width: 1200px; margin: 0 auto; }

  h2 { font-size: 13px; font-weight: 600; color: #555; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 14px; }

  /* Stats row */
  .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 32px; }
  @media (max-width: 800px) { .stats { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 500px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  .stat-card { background: #161616; border: 1px solid #1e1e1e; border-radius: 10px; padding: 18px 20px; }
  .stat-value { font-size: 28px; font-weight: 700; color: #4ade80; line-height: 1; }
  .stat-label { font-size: 11px; color: #555; margin-top: 6px; text-transform: uppercase; letter-spacing: 0.5px; }

  /* Chart grid */
  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
  @media (max-width: 900px) { .charts { grid-template-columns: 1fr; } }
  .chart-card { background: #161616; border: 1px solid #1e1e1e; border-radius: 10px; padding: 20px; }
  .chart-card.full { grid-column: 1 / -1; }

  .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .chart-header h2 { margin-bottom: 0; }
  select { background: #0d0d0d; border: 1px solid #2a2a2a; color: #ccc; padding: 5px 10px; border-radius: 6px; font-size: 12px; outline: none; cursor: pointer; max-width: 200px; }
</style>
</head>
<body>

<nav>
  <div class="nav-brand">🔒 <span>Gym</span>Locker</div>
  <div class="nav-right">
    <a href="/workout/new" class="new">+ New Workout</a>
    <a href="/dashboard">Calendar</a>
    <a href="/logout">Sign out</a>
  </div>
</nav>

<main>
  <!-- Stats -->
  <div class="stats">
    <div class="stat-card">
      <div class="stat-value">{{ stats.total }}</div>
      <div class="stat-label">Total Sessions</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">{{ stats.this_week }}</div>
      <div class="stat-label">This Week</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">{{ stats.streak }}</div>
      <div class="stat-label">Day Streak</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">{{ summary.avg_per_week }}</div>
      <div class="stat-label">Avg / Week</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" style="font-size:16px; padding-top:6px">{{ stats.last_workout }}</div>
      <div class="stat-label">Last Workout</div>
    </div>
  </div>

  <!-- Charts row 1 -->
  <div class="charts">
    <div class="chart-card">
      <div class="chart-header"><h2>Top Exercises</h2></div>
      <canvas id="freqChart" height="260"></canvas>
    </div>
    <div class="chart-card">
      <div class="chart-header"><h2>Monthly Activity</h2></div>
      <canvas id="monthChart" height="260"></canvas>
    </div>
  </div>

  <!-- Charts row 2 -->
  <div class="charts">
    <div class="chart-card full">
      <div class="chart-header">
        <h2>Exercise Progress</h2>
        <select id="exerciseSelect"></select>
      </div>
      <canvas id="progressChart" height="100"></canvas>
    </div>
  </div>
</main>

<script>
const workouts = {{ workouts_json | safe }};

Chart.defaults.color = '#555';
Chart.defaults.borderColor = '#1e1e1e';
Chart.defaults.font.family = "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";

// ── Top Exercises (horizontal bar) ────────────────────────────────────────────
const topExercises = {{ summary.top_exercises | tojson }};
new Chart(document.getElementById('freqChart'), {
  type: 'bar',
  data: {
    labels: topExercises.map(e => e[0]),
    datasets: [{
      data: topExercises.map(e => e[1]),
      backgroundColor: 'rgba(74,222,128,0.7)',
      borderRadius: 4,
      borderSkipped: false,
    }]
  },
  options: {
    indexAxis: 'y',
    responsive: true,
    plugins: { legend: { display: false } },
    scales: {
      x: { beginAtZero: true, ticks: { stepSize: 1 } },
      y: { ticks: { font: { size: 11 } } }
    }
  }
});

// ── Monthly Activity ──────────────────────────────────────────────────────────
const monthCounts = {{ summary.month_counts | tojson }};
const monthLabels = Object.keys(monthCounts);
const monthData   = Object.values(monthCounts);
new Chart(document.getElementById('monthChart'), {
  type: 'bar',
  data: {
    labels: monthLabels,
    datasets: [{
      data: monthData,
      backgroundColor: 'rgba(74,222,128,0.7)',
      borderRadius: 4,
      borderSkipped: false,
    }]
  },
  options: {
    responsive: true,
    plugins: { legend: { display: false } },
    scales: {
      x: { ticks: { maxTicksLimit: 6 } },
      y: { beginAtZero: true, ticks: { stepSize: 1 } }
    }
  }
});

// ── Exercise Progress ─────────────────────────────────────────────────────────
const allExercises = [...new Set(workouts.flatMap(w => w.exercise_names))].sort();
const sel = document.getElementById('exerciseSelect');
allExercises.forEach(name => {
  const opt = document.createElement('option');
  opt.value = name; opt.textContent = name;
  sel.appendChild(opt);
});

function getProgressData(name) {
  return [...workouts].reverse()
    .filter(w => w.exercises.find(e => e.name === name && e.max_weight > 0))
    .map(w => ({ x: w.date, y: w.exercises.find(e => e.name === name).max_weight }));
}

const progressChart = new Chart(document.getElementById('progressChart'), {
  type: 'line',
  data: {
    datasets: [{
      label: 'Max weight (kg)',
      data: getProgressData(allExercises[0] || ''),
      borderColor: '#4ade80',
      backgroundColor: 'rgba(74,222,128,0.08)',
      pointBackgroundColor: '#4ade80',
      pointRadius: 4,
      tension: 0.3,
      fill: true,
    }]
  },
  options: {
    responsive: true,
    interaction: { mode: 'index', intersect: false },
    scales: {
      x: { ticks: { maxTicksLimit: 8 } },
      y: { beginAtZero: false, ticks: { callback: v => v + ' kg' } }
    },
    plugins: { legend: { display: false } }
  }
});

sel.addEventListener('change', () => {
  progressChart.data.datasets[0].data = getProgressData(sel.value);
  progressChart.update();
});
</script>
</body>
</html>
