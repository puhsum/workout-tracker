<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GymLocker — Summary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root { --bg:#0d0d0d; --surface:#1a1a1a; --white:#161616; --border:#1e1e1e; --ink:#e0e0e0; --ink-2:#888; --ink-3:#555; }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif; min-height: 100vh; padding-bottom: 48px; }

  nav { background: var(--bg); border-bottom: 1px solid var(--border); padding: 0 24px; height: 58px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .nav-brand { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
  .nav-right { display: flex; gap: 8px; }
  .nav-right a { font-size: 13px; font-weight: 500; color: var(--ink-2); text-decoration: none; padding: 6px 14px; border: 1px solid var(--border); border-radius: 20px; background: var(--white); transition: all 0.15s; }
  .nav-right a:hover { border-color: var(--ink); color: var(--ink); }
  .nav-right a.new { background: #4ade80; color: #0d0d0d; border-color: #4ade80; font-weight: 700; }

  main { padding: 28px 24px; max-width: 1200px; margin: 0 auto; }

  .label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: var(--ink-3); margin-bottom: 6px; }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 28px; }
  @media (max-width: 800px) { .stats { grid-template-columns: repeat(3, 1fr); } }
  .stat-card { background: var(--white); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; }
  .stat-value { font-size: 34px; font-weight: 700; color: #4ade80; line-height: 1; letter-spacing: -1px; }
  .stat-value.sm { font-size: 18px; padding-top: 8px; letter-spacing: -0.5px; }

  /* Charts */
  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  @media (max-width: 900px) { .charts { grid-template-columns: 1fr; } }
  .chart-card { background: var(--white); border: 1px solid var(--border); border-radius: 12px; padding: 22px; }
  .chart-card.full { grid-column: 1 / -1; }
  .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }

  select { background: var(--white); border: 1px solid var(--border); color: var(--ink); padding: 5px 10px; border-radius: 20px; font-size: 12px; font-family: inherit; outline: none; cursor: pointer; }
</style>
</head>
<body>
<nav>
  <div class="nav-brand">GymLocker</div>
  <div class="nav-right">
    <a href="/workout/new" class="new">+ New Workout</a>
    <a href="/dashboard">Calendar</a>
    <a href="/logout">Sign out</a>
  </div>
</nav>

<main>
  <div class="stats">
    <div class="stat-card">
      <div class="label">Total Sessions</div>
      <div class="stat-value">{{ stats.total }}</div>
    </div>
    <div class="stat-card">
      <div class="label">This Week</div>
      <div class="stat-value">{{ stats.this_week }}</div>
    </div>
    <div class="stat-card">
      <div class="label">Day Streak</div>
      <div class="stat-value">{{ stats.streak }}</div>
    </div>
    <div class="stat-card">
      <div class="label">Avg / Week</div>
      <div class="stat-value">{{ summary.avg_per_week }}</div>
    </div>
    <div class="stat-card">
      <div class="label">Last Workout</div>
      <div class="stat-value sm">{{ stats.last_workout }}</div>
    </div>
  </div>

  <div class="charts">
    <div class="chart-card">
      <div class="chart-header">
        <div class="label" style="margin:0">Top Exercises</div>
      </div>
      <canvas id="freqChart" height="260"></canvas>
    </div>
    <div class="chart-card">
      <div class="chart-header">
        <div class="label" style="margin:0">Monthly Activity</div>
      </div>
      <canvas id="monthChart" height="260"></canvas>
    </div>
  </div>

  <div class="charts">
    <div class="chart-card full">
      <div class="chart-header">
        <div class="label" style="margin:0">Exercise Progress</div>
        <select id="exerciseSelect"></select>
      </div>
      <canvas id="progressChart" height="100"></canvas>
    </div>
  </div>
</main>

<script>
const workouts = {{ workouts_json | safe }};
Chart.defaults.color = '#aaa';
Chart.defaults.borderColor = 'rgba(0,0,0,0.07)';
Chart.defaults.font.family = "'DM Sans', -apple-system, sans-serif";

const INK = '#1a1a1a';
const INK_ALPHA = 'rgba(26,26,26,0.75)';

new Chart(document.getElementById('freqChart'), {
  type: 'bar',
  data: {
    labels: {{ summary.top_exercises | map(attribute=0) | list | tojson }},
    datasets: [{ data: {{ summary.top_exercises | map(attribute=1) | list | tojson }}, backgroundColor: INK_ALPHA, borderRadius: 4, borderSkipped: false }]
  },
  options: { indexAxis: 'y', responsive: true, plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true, ticks: { stepSize: 1 } }, y: { ticks: { font: { size: 11 } } } } }
});

new Chart(document.getElementById('monthChart'), {
  type: 'bar',
  data: {
    labels: {{ summary.month_counts.keys() | list | tojson }},
    datasets: [{ data: {{ summary.month_counts.values() | list | tojson }}, backgroundColor: INK_ALPHA, borderRadius: 4, borderSkipped: false }]
  },
  options: { responsive: true, plugins: { legend: { display: false } }, scales: { x: { ticks: { maxTicksLimit: 6 } }, y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
});

const allExercises = [...new Set(workouts.flatMap(w => w.exercise_names))].sort();
const sel = document.getElementById('exerciseSelect');
allExercises.forEach(name => { const o = document.createElement('option'); o.value = o.textContent = name; sel.appendChild(o); });

function getProgressData(name) {
  return [...workouts].reverse().filter(w => w.exercises.find(e => e.name === name && e.max_weight > 0))
    .map(w => ({ x: w.date, y: w.exercises.find(e => e.name === name).max_weight }));
}

const progressChart = new Chart(document.getElementById('progressChart'), {
  type: 'line',
  data: { datasets: [{ label: 'Max weight (kg)', data: getProgressData(allExercises[0] || ''), borderColor: INK, backgroundColor: 'rgba(26,26,26,0.05)', pointBackgroundColor: INK, pointRadius: 4, tension: 0.3, fill: true }] },
  options: { responsive: true, interaction: { mode: 'index', intersect: false }, scales: { x: { ticks: { maxTicksLimit: 8 } }, y: { beginAtZero: false, ticks: { callback: v => v + ' kg' } } }, plugins: { legend: { display: false } } }
});
sel.addEventListener('change', () => { progressChart.data.datasets[0].data = getProgressData(sel.value); progressChart.update(); });
</script>
</body>
</html>
