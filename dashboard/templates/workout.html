<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GymLocker — Log Workout</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overflow-x: hidden; }
  body {
    background: #0d0d0d;
    color: #e0e0e0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    padding-bottom: 40px;
  }

  /* Nav — 3-column grid so timer stays perfectly centred on any screen width */
  nav {
    background: #111;
    border-bottom: 1px solid #1e1e1e;
    padding: 0 16px;
    height: 56px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
    width: 100vw;
  }
  .nav-back {
    color: #555;
    font-size: 22px;
    text-decoration: none;
    line-height: 1;
    justify-self: start;
    padding: 8px 8px 8px 0;
  }
  .timer {
    font-size: 22px;
    font-weight: 700;
    color: #4ade80;
    font-variant-numeric: tabular-nums;
    letter-spacing: 1px;
    justify-self: center;
  }
  .btn-finish {
    background: #4ade80;
    color: #000;
    font-weight: 700;
    font-size: 14px;
    border: none;
    border-radius: 8px;
    padding: 9px 16px;
    cursor: pointer;
    transition: background 0.15s;
    justify-self: end;
    white-space: nowrap;
  }
  .btn-finish:hover { background: #22c55e; }
  .btn-finish:disabled { background: #2a2a2a; color: #555; cursor: not-allowed; }

  /* Main layout */
  main { padding: 20px; max-width: 600px; margin: 0 auto; }

  /* Section labels */
  .section-title {
    font-size: 11px;
    font-weight: 600;
    color: #555;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 10px;
  }

  /* Logged exercises */
  #exercise-list { margin-bottom: 28px; }
  .ex-card {
    background: #161616;
    border: 1px solid #1e1e1e;
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 8px;
  }
  .ex-card-body { flex: 1; }
  .ex-card-name { font-size: 14px; font-weight: 600; color: #e0e0e0; margin-bottom: 3px; }
  .ex-card-sets { font-size: 12px; color: #666; font-family: 'SF Mono', Menlo, monospace; }
  .btn-remove {
    background: none;
    border: none;
    color: #444;
    font-size: 18px;
    cursor: pointer;
    padding: 0 0 0 12px;
    line-height: 1;
    flex-shrink: 0;
    transition: color 0.15s;
  }
  .btn-remove:hover { color: #f87171; }
  .empty-state { color: #444; font-size: 13px; text-align: center; padding: 20px 0; }

  /* Add exercise form */
  .form-card {
    background: #161616;
    border: 1px solid #1e1e1e;
    border-radius: 12px;
    padding: 18px;
  }

  /* Inputs */
  input[type="text"], input[type="number"] {
    background: #0d0d0d;
    border: 1px solid #2a2a2a;
    color: #e0e0e0;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 15px;
    outline: none;
    width: 100%;
    transition: border-color 0.15s;
    -webkit-appearance: none;
    appearance: none;
  }
  input[type="text"]:focus, input[type="number"]:focus { border-color: #4ade80; }
  input::placeholder { color: #444; }

  /* Exercise name row */
  .name-row { margin-bottom: 14px; }

  /* Type toggle */
  .type-toggle {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .type-btn {
    flex: 1;
    background: #0d0d0d;
    border: 1px solid #2a2a2a;
    color: #666;
    border-radius: 8px;
    padding: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
  }
  .type-btn.active { border-color: #4ade80; color: #4ade80; background: rgba(74,222,128,0.05); }

  /* Sets section */
  #sets-container { margin-bottom: 12px; }

  .set-row {
    display: grid;
    grid-template-columns: 1fr 16px 1fr 28px;
    align-items: center;
    gap: 6px;
    margin-bottom: 8px;
  }
  .set-row .sep { font-size: 14px; color: #444; text-align: center; }
  .btn-rm-set {
    background: none;
    border: none;
    color: #444;
    font-size: 16px;
    cursor: pointer;
    padding: 4px;
    flex-shrink: 0;
    transition: color 0.15s;
  }
  .btn-rm-set:hover { color: #f87171; }

  /* Duration row */
  #duration-row { margin-bottom: 12px; display: none; }
  #duration-row input { width: 100%; }

  /* Buttons */
  .btn-add-set {
    background: none;
    border: 1px dashed #2a2a2a;
    color: #555;
    border-radius: 8px;
    padding: 8px;
    font-size: 13px;
    cursor: pointer;
    width: 100%;
    margin-bottom: 14px;
    transition: all 0.15s;
  }
  .btn-add-set:hover { border-color: #4ade80; color: #4ade80; }

  .btn-log {
    background: #1e1e1e;
    border: 1px solid #2a2a2a;
    color: #e0e0e0;
    border-radius: 8px;
    padding: 11px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    transition: all 0.15s;
  }
  .btn-log:hover { border-color: #4ade80; color: #4ade80; }

  /* Toast */
  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: #1e1e1e;
    border: 1px solid #2a2a2a;
    color: #e0e0e0;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<nav>
  <a href="/dashboard" class="nav-back">←</a>
  <div id="timer" class="timer">0:00</div>
  <button class="btn-finish" id="btn-finish" onclick="finishWorkout()">Finish</button>
</nav>

<main>
  <!-- Logged exercises -->
  <div id="exercise-list">
    <div class="section-title">Exercises</div>
    <div id="ex-items">
      <div class="empty-state" id="empty-msg">No exercises logged yet</div>
    </div>
  </div>

  <!-- Add exercise form -->
  <div class="section-title">Add Exercise</div>
  <div class="form-card">
    <!-- Name -->
    <div class="name-row">
      <input
        type="text"
        id="ex-name"
        placeholder="Exercise name"
        autocomplete="off"
        list="ex-suggestions"
      >
      <datalist id="ex-suggestions"></datalist>
    </div>

    <!-- Reps / Duration toggle -->
    <div class="type-toggle">
      <div class="type-btn active" id="btn-type-reps" onclick="setType('reps')">Reps</div>
      <div class="type-btn" id="btn-type-duration" onclick="setType('duration')">Duration</div>
    </div>

    <!-- Reps sets -->
    <div id="sets-container"></div>
    <button class="btn-add-set" id="btn-add-set" onclick="addSetRow()">+ Add set</button>

    <!-- Duration input -->
    <div id="duration-row">
      <input type="text" id="duration-input" placeholder="e.g. 10min, 5:30">
    </div>

    <button class="btn-log" onclick="logExercise()">Log Exercise</button>
  </div>
</main>

<div id="toast"></div>

<script>
let sessionId = null;
let startTime = null;
let timerInterval = null;
let exerciseType = 'reps'; // 'reps' | 'duration'
let exercises = []; // local mirror of session.exercises

// ── Init ──────────────────────────────────────────────────────────────────────

async function init() {
  await loadExerciseSuggestions();

  const stored = localStorage.getItem('workout_session');
  if (stored) {
    try {
      const { id, start } = JSON.parse(stored);
      const today = new Date().toISOString().slice(0, 10);
      if (start.startsWith(today)) {
        const res = await fetch(`/api/workout/${id}`);
        if (res.ok) {
          const s = await res.json();
          sessionId = s.id;
          startTime = new Date(s.start_time);
          exercises = s.exercises;
          renderExercises();
          startTimer();
          addSetRow();
          return;
        }
      }
    } catch (_) {}
  }

  // Start fresh
  const res = await fetch('/api/workout/start', { method: 'POST' });
  if (!res.ok) {
    fatalError(`Could not start session (HTTP ${res.status}). Try refreshing.`);
    return;
  }
  const data = await res.json();
  sessionId = data.session_id;
  startTime = new Date(data.start_time);
  localStorage.setItem('workout_session', JSON.stringify({ id: sessionId, start: data.start_time }));
  startTimer();
  addSetRow();
}

function fatalError(msg) {
  const nav = document.querySelector('nav');
  const banner = document.createElement('div');
  banner.style.cssText = 'background:#7f1d1d;color:#fca5a5;padding:12px 20px;font-size:13px;font-weight:600;text-align:center;';
  banner.textContent = '⚠ ' + msg;
  nav.after(banner);
}

// ── Timer ─────────────────────────────────────────────────────────────────────

function startTimer() {
  timerInterval = setInterval(updateTimer, 1000);
  updateTimer();
}

function updateTimer() {
  const elapsed = Math.floor((Date.now() - startTime.getTime()) / 1000);
  const h = Math.floor(elapsed / 3600);
  const m = Math.floor((elapsed % 3600) / 60);
  const s = elapsed % 60;
  const pad = n => String(n).padStart(2, '0');
  document.getElementById('timer').textContent =
    h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
}

// ── Exercise suggestions ───────────────────────────────────────────────────────

async function loadExerciseSuggestions() {
  try {
    const res = await fetch('/api/exercises');
    const { exercises } = await res.json();
    const dl = document.getElementById('ex-suggestions');
    exercises.forEach(name => {
      const opt = document.createElement('option');
      opt.value = name;
      dl.appendChild(opt);
    });
  } catch (_) {}
}

// ── Type toggle ───────────────────────────────────────────────────────────────

function setType(type) {
  exerciseType = type;
  document.getElementById('btn-type-reps').classList.toggle('active', type === 'reps');
  document.getElementById('btn-type-duration').classList.toggle('active', type === 'duration');
  document.getElementById('sets-container').style.display = type === 'reps' ? '' : 'none';
  document.getElementById('btn-add-set').style.display = type === 'reps' ? '' : 'none';
  document.getElementById('duration-row').style.display = type === 'duration' ? 'block' : 'none';
}

// ── Set rows ──────────────────────────────────────────────────────────────────

function addSetRow() {
  const container = document.getElementById('sets-container');
  const count = container.querySelectorAll('.set-row').length + 1;

  const row = document.createElement('div');
  row.className = 'set-row';
  row.innerHTML = `
    <input type="number" placeholder="kg" min="0" step="0.5" class="weight-input">
    <span class="sep">×</span>
    <input type="number" placeholder="reps" min="1" step="1" class="reps-input">
    <button class="btn-rm-set" onclick="removeSetRow(this)" title="Remove set">✕</button>
  `;
  container.appendChild(row);

  // Auto-fill weight from previous set
  const rows = container.querySelectorAll('.set-row');
  if (rows.length > 1) {
    const prevWeight = rows[rows.length - 2].querySelector('.weight-input').value;
    if (prevWeight) row.querySelector('.weight-input').value = prevWeight;
  }

  row.querySelector('.reps-input').focus();
}

function removeSetRow(btn) {
  const container = document.getElementById('sets-container');
  const rows = container.querySelectorAll('.set-row');
  if (rows.length > 1) {
    btn.closest('.set-row').remove();
  }
}

// ── Log exercise ──────────────────────────────────────────────────────────────

async function logExercise() {
  const name = document.getElementById('ex-name').value.trim();
  if (!name) { toast('Enter an exercise name'); return; }

  let sets = [];

  if (exerciseType === 'duration') {
    const dur = document.getElementById('duration-input').value.trim();
    if (!dur) { toast('Enter a duration'); return; }
    sets = [{ type: 'duration', duration: dur }];
  } else {
    const rows = document.querySelectorAll('#sets-container .set-row');
    for (const row of rows) {
      const repsEl = row.querySelector('.reps-input');
      const reps = parseInt(repsEl.value);
      if (!reps) { toast('Enter reps for each set'); repsEl.focus(); return; }
      const weightVal = row.querySelector('.weight-input').value;
      const weight = weightVal ? parseFloat(weightVal) : null;
      sets.push(weight ? { weight, reps } : { reps });
    }
    if (!sets.length) { toast('Add at least one set'); return; }
  }

  const res = await fetch(`/api/workout/${sessionId}/exercise`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, sets }),
  });

  if (!res.ok) {
    const err = await res.text().catch(() => '');
    toast(`Save failed (${res.status})${err ? ': ' + err.slice(0, 80) : ''}`);
    return;
  }
  const session = await res.json();
  exercises = session.exercises;
  renderExercises();
  resetForm();
  toast(`${name} logged`);
}

// ── Remove exercise ───────────────────────────────────────────────────────────

async function removeExercise(index) {
  const res = await fetch(`/api/workout/${sessionId}/exercise/${index}`, { method: 'DELETE' });
  if (!res.ok) return;
  const session = await res.json();
  exercises = session.exercises;
  renderExercises();
}

// ── Render exercise list ──────────────────────────────────────────────────────

function fmtSets(sets) {
  if (!sets || !sets.length) return '';
  if (sets[0].type === 'duration') return `duration: ${sets[0].duration}`;
  return sets.map(s => s.weight ? `${s.weight}×${s.reps}` : `×${s.reps}`).join('  ');
}

function renderExercises() {
  const container = document.getElementById('ex-items');
  const emptyMsg = document.getElementById('empty-msg');
  container.innerHTML = '';

  if (!exercises.length) {
    container.appendChild(emptyMsg || (() => {
      const d = document.createElement('div');
      d.className = 'empty-state';
      d.id = 'empty-msg';
      d.textContent = 'No exercises logged yet';
      return d;
    })());
    return;
  }

  exercises.forEach((ex, i) => {
    const card = document.createElement('div');
    card.className = 'ex-card';
    card.innerHTML = `
      <div class="ex-card-body">
        <div class="ex-card-name">${escHtml(ex.name)}</div>
        <div class="ex-card-sets">${escHtml(fmtSets(ex.sets))}</div>
      </div>
      <button class="btn-remove" onclick="removeExercise(${i})" title="Remove">✕</button>
    `;
    container.appendChild(card);
  });
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Reset form ────────────────────────────────────────────────────────────────

function resetForm() {
  document.getElementById('ex-name').value = '';
  document.getElementById('duration-input').value = '';
  document.getElementById('sets-container').innerHTML = '';
  setType('reps');
  addSetRow();
  document.getElementById('ex-name').focus();
}

// ── Finish workout ────────────────────────────────────────────────────────────

async function finishWorkout() {
  if (!exercises.length) { toast('Log at least one exercise first'); return; }

  const btn = document.getElementById('btn-finish');
  btn.disabled = true;
  btn.textContent = 'Saving…';

  clearInterval(timerInterval);

  const res = await fetch(`/api/workout/${sessionId}/finish`, { method: 'POST' });
  if (!res.ok) {
    btn.disabled = false;
    btn.textContent = 'Finish';
    const err = await res.text().catch(() => '');
    toast(`Finish failed (${res.status})${err ? ': ' + err.slice(0, 100) : ''}`);
    return;
  }

  localStorage.removeItem('workout_session');
  window.location.href = '/dashboard';
}

// ── Toast ─────────────────────────────────────────────────────────────────────

let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

// ── Start ─────────────────────────────────────────────────────────────────────
init().catch(err => fatalError('Startup error: ' + err.message));
</script>
</body>
</html>
