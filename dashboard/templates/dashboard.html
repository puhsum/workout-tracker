<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GymLocker</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d0d0d; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; min-height: 100vh; }

  /* Nav */
  nav { background: #111; border-bottom: 1px solid #1e1e1e; padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 200; }
  .nav-brand { font-size: 16px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 8px; }
  .nav-brand span { color: #4ade80; }
  .nav-right { display: flex; align-items: center; gap: 12px; }
  .nav-right a { font-size: 13px; color: #888; text-decoration: none; padding: 6px 12px; border: 1px solid #2a2a2a; border-radius: 6px; transition: all 0.15s; }
  .nav-right a:hover { color: #fff; border-color: #444; }
  .nav-right a.new { color: #4ade80; border-color: #4ade80; }
  .nav-right a.new:hover { background: rgba(74,222,128,0.08); }

  main { padding: 24px; max-width: 1440px; margin: 0 auto; }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 28px; }
  @media (max-width: 700px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  .stat-card { background: #161616; border: 1px solid #1e1e1e; border-radius: 10px; padding: 18px 20px; }
  .stat-value { font-size: 32px; font-weight: 700; color: #4ade80; line-height: 1; }
  .stat-label { font-size: 11px; color: #555; margin-top: 6px; text-transform: uppercase; letter-spacing: 0.5px; }

  /* Calendar header */
  .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .cal-title { font-size: 20px; font-weight: 700; color: #fff; }
  .cal-nav { display: flex; gap: 8px; }
  .cal-nav button { background: #161616; border: 1px solid #2a2a2a; color: #888; border-radius: 6px; padding: 6px 14px; font-size: 14px; cursor: pointer; transition: all 0.15s; }
  .cal-nav button:hover { border-color: #444; color: #fff; }

  /* Day-of-week headers */
  .cal-dow { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 4px; }
  .cal-dow-cell { text-align: center; font-size: 11px; font-weight: 600; color: #444; text-transform: uppercase; letter-spacing: 0.5px; padding: 6px 0; }

  /* Calendar grid */
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-cell {
    background: #111;
    border: 1px solid #1a1a1a;
    border-radius: 8px;
    min-height: 100px;
    padding: 10px;
    position: relative;
    cursor: default;
    transition: border-color 0.12s, background 0.12s;
    overflow: hidden;
  }
  .cal-cell.empty { background: transparent; border-color: transparent; cursor: default; }
  .cal-cell.has-workout { cursor: pointer; }
  .cal-cell.has-workout:hover { background: #161616; border-color: #2a2a2a; }
  .cal-cell.is-today { border-color: #4ade80 !important; }
  .cal-cell.is-today .cal-day-num { color: #4ade80; }

  .cal-day-num { font-size: 12px; font-weight: 600; color: #444; margin-bottom: 6px; }
  .cal-cell.has-workout .cal-day-num { color: #888; }

  .cal-dot { width: 6px; height: 6px; background: #4ade80; border-radius: 50%; margin-bottom: 6px; }

  .cal-ex-list { display: flex; flex-direction: column; gap: 2px; }
  .cal-ex-name {
    font-size: 11px;
    color: #4ade80;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.4;
  }
  .cal-ex-more { font-size: 10px; color: #444; margin-top: 2px; }

  /* Tooltip */
  #tooltip {
    position: fixed;
    z-index: 999;
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    padding: 14px 16px;
    min-width: 220px;
    max-width: 300px;
    pointer-events: none;
    display: none;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  }
  .tt-date { font-size: 13px; font-weight: 700; color: #fff; margin-bottom: 2px; }
  .tt-meta { font-size: 11px; color: #555; margin-bottom: 10px; }
  .tt-divider { height: 1px; background: #2a2a2a; margin-bottom: 10px; }
  .tt-ex { margin-bottom: 8px; }
  .tt-ex:last-child { margin-bottom: 0; }
  .tt-ex-name { font-size: 12px; font-weight: 600; color: #e0e0e0; margin-bottom: 2px; }
  .tt-ex-sets { font-size: 11px; color: #555; font-family: 'SF Mono', Menlo, monospace; }
</style>
</head>
<body>

<nav>
  <div class="nav-brand">🔒 <span>Gym</span>Locker</div>
  <div class="nav-right">
    <a href="/workout/new" class="new">+ New Workout</a>
    <a href="/logout">Sign out</a>
  </div>
</nav>

<main>
  <!-- Stats -->
  <div class="stats">
    <div class="stat-card">
      <div class="stat-value">{{ stats.total }}</div>
      <div class="stat-label">Total Sessions</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">{{ stats.this_week }}</div>
      <div class="stat-label">This Week</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">{{ stats.streak }}</div>
      <div class="stat-label">Day Streak</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" style="font-size:20px; padding-top:6px">{{ stats.last_workout }}</div>
      <div class="stat-label">Last Workout</div>
    </div>
  </div>

  <!-- Calendar -->
  <div class="cal-header">
    <div class="cal-title" id="cal-title"></div>
    <div class="cal-nav">
      <button onclick="shiftMonth(-1)">←</button>
      <button onclick="goToday()">Today</button>
      <button onclick="shiftMonth(1)">→</button>
    </div>
  </div>
  <div class="cal-dow">
    <div class="cal-dow-cell">Mon</div>
    <div class="cal-dow-cell">Tue</div>
    <div class="cal-dow-cell">Wed</div>
    <div class="cal-dow-cell">Thu</div>
    <div class="cal-dow-cell">Fri</div>
    <div class="cal-dow-cell">Sat</div>
    <div class="cal-dow-cell">Sun</div>
  </div>
  <div class="cal-grid" id="cal-grid"></div>
</main>

<!-- Tooltip -->
<div id="tooltip"></div>

<script>
const workouts = {{ workouts_json | safe }};

// Group workouts by date (multiple sessions same day supported)
const byDate = {};
workouts.forEach(w => {
  if (!byDate[w.date]) byDate[w.date] = [];
  byDate[w.date].push(w);
});

const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const today = new Date();
let curYear = today.getFullYear();
let curMonth = today.getMonth();

function pad(n) { return String(n).padStart(2, '0'); }
function dateStr(y, m, d) { return `${y}-${pad(m+1)}-${pad(d)}`; }

function renderCalendar() {
  const firstDay = new Date(curYear, curMonth, 1);
  const daysInMonth = new Date(curYear, curMonth + 1, 0).getDate();
  const todayStr = dateStr(today.getFullYear(), today.getMonth(), today.getDate());

  document.getElementById('cal-title').textContent = `${MONTHS[curMonth]} ${curYear}`;

  // Monday-start offset (0=Mon … 6=Sun)
  let offset = (firstDay.getDay() + 6) % 7;

  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';

  // Empty leading cells
  for (let i = 0; i < offset; i++) {
    const el = document.createElement('div');
    el.className = 'cal-cell empty';
    grid.appendChild(el);
  }

  // Day cells
  for (let d = 1; d <= daysInMonth; d++) {
    const ds = dateStr(curYear, curMonth, d);
    const sessions = byDate[ds] || [];
    const hasWorkout = sessions.length > 0;
    const isToday = ds === todayStr;

    const cell = document.createElement('div');
    cell.className = 'cal-cell' + (hasWorkout ? ' has-workout' : '') + (isToday ? ' is-today' : '');

    let inner = `<div class="cal-day-num">${d}</div>`;

    if (hasWorkout) {
      const allExNames = sessions.flatMap(s => s.exercise_names);
      inner += `<div class="cal-dot"></div>`;
      inner += `<div class="cal-ex-list">`;
      const show = allExNames.slice(0, 3);
      show.forEach(name => {
        inner += `<div class="cal-ex-name">${escHtml(name)}</div>`;
      });
      if (allExNames.length > 3) {
        inner += `<div class="cal-ex-more">+${allExNames.length - 3} more</div>`;
      }
      inner += `</div>`;

      cell.addEventListener('mouseenter', (e) => showTooltip(e, ds, sessions));
      cell.addEventListener('mouseleave', hideTooltip);
      cell.addEventListener('click', () => { window.location.href = `/log/${ds}`; });
    }

    cell.innerHTML = inner;
    grid.appendChild(cell);
  }
}

function shiftMonth(dir) {
  curMonth += dir;
  if (curMonth > 11) { curMonth = 0; curYear++; }
  if (curMonth < 0)  { curMonth = 11; curYear--; }
  renderCalendar();
}

function goToday() {
  curYear = today.getFullYear();
  curMonth = today.getMonth();
  renderCalendar();
}

// ── Tooltip ───────────────────────────────────────────────────────────────────

const tooltip = document.getElementById('tooltip');

function showTooltip(e, ds, sessions) {
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const [y, m, d] = ds.split('-').map(Number);
  const label = `${months[m-1]} ${d}, ${y}`;
  const totalExercises = sessions.reduce((s, w) => s + w.exercises.length, 0);
  const durations = sessions.map(w => w.duration).filter(Boolean);
  const durationText = durations.length ? durations.join(' + ') + ' min' : '';

  let html = `<div class="tt-date">${label}</div>`;
  html += `<div class="tt-meta">${totalExercises} exercise${totalExercises !== 1 ? 's' : ''}${durationText ? ' · ' + durationText : ''}</div>`;
  html += `<div class="tt-divider"></div>`;

  sessions.forEach(w => {
    w.exercises.forEach(ex => {
      html += `<div class="tt-ex">
        <div class="tt-ex-name">${escHtml(ex.name)}</div>
        ${ex.sets_raw ? `<div class="tt-ex-sets">${escHtml(ex.sets_raw)}</div>` : ''}
      </div>`;
    });
  });

  tooltip.innerHTML = html;
  tooltip.style.display = 'block';
  positionTooltip(e);
}

function positionTooltip(e) {
  const tw = tooltip.offsetWidth;
  const th = tooltip.offsetHeight;
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  let x = e.clientX + 16;
  let y = e.clientY + 16;
  if (x + tw > vw - 8) x = e.clientX - tw - 8;
  if (y + th > vh - 8) y = e.clientY - th - 8;
  tooltip.style.left = x + 'px';
  tooltip.style.top  = y + 'px';
}

function hideTooltip() {
  tooltip.style.display = 'none';
}

// Follow mouse within the cell
document.getElementById('cal-grid').addEventListener('mousemove', (e) => {
  if (tooltip.style.display === 'block') positionTooltip(e);
});

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

renderCalendar();
</script>
</body>
</html>
